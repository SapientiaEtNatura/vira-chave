name: CI (Vira Chave)

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Security Audit (Dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/virachave?schema=public"
          AUTH_SECRET: "ci-build-secret-placeholder"
        run: npm run build

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'SapientiaEtNatura'
    runs-on: self-hosted
    # Configure required reviewers on the "production" GitHub Environment (self-hosted runner in public repo)
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Docker Compose
        run: bash infra/server/deploy.sh
