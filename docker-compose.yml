services:
  db:
    image: postgres:16.8-alpine
    container_name: virachave-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-virachave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virachave2026}
      POSTGRES_DB: ${POSTGRES_DB:-virachave}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-virachave} -d $${POSTGRES_DB:-virachave}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: infra/local/Dockerfile.dev
    container_name: virachave-local-app
    restart: unless-stopped
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-virachave}:${POSTGRES_PASSWORD:-virachave2026}@db:5432/${POSTGRES_DB:-virachave}?schema=public&connection_limit=15&pool_timeout=10
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-troque-em-producao}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      UPLOAD_DIR: /app/uploads
      SEED_DEV_USERS: "true"
      NODE_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        if [ ! -d node_modules/next ]; then npm ci; fi &&
        if [ ! -d node_modules/.prisma ]; then npx prisma generate; fi &&
        npm run dev -- -H 0.0.0.0 -p 3000
      "

  k6:
    image: grafana/k6:0.56.0
    container_name: virachave-local-k6
    profiles: ["loadtest"]
    working_dir: /scripts
    volumes:
      - ./tests/load:/scripts:ro
    depends_on:
      - app

volumes:
  pgdata_local:
  node_modules_cache:
  next_cache:
