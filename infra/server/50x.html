<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIRA CHAVE — Atualização em andamento</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #faf9f6;
      --surface: #ffffff;
      --border: #e5e0d5;
      --ink: #1f2421;
      --muted: #5b635e;
      --brand: #1f6f54;
      --brand-hover: #175741;
      --soft: #ebf5f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 8px 24px rgba(31, 36, 33, 0.06);
      text-align: center;
    }
    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--brand);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.3;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 15px;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: 10px;
      background: var(--brand);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    a.button:hover {
      background: var(--brand-hover);
    }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="badge">VIRA CHAVE</div>
    <h1>Estamos atualizando o VIRA CHAVE</h1>
    <p>O sistema está passando por uma breve atualização ou reinicialização. Tente novamente em alguns segundos.</p>
    <div class="actions">
      <a class="button" href="">Tentar novamente</a>
    </div>
  </main>
</body>
</html>
