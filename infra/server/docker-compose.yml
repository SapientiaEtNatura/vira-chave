x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Calibrated for single-host Ubuntu Server (7.2 GB RAM, 8 CPUs)
services:
  db:
    image: postgres:16.8-alpine
    container_name: virachave-db
    restart: unless-stopped
    logging: *default-logging
    shm_size: 256m
    mem_limit: 1536m
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    env_file: .env
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1152MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
      - -c
      - statement_timeout=15000
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: virachave-app
    restart: unless-stopped
    logging: *default-logging
    init: true
    stop_grace_period: 15s
    mem_limit: 1536m
    cpus: 3.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=64m,uid=1001,gid=1001
    env_file: .env
    environment:
      UPLOAD_DIR: /app/uploads
      AUTH_TRUST_HOST: "true"
      NODE_OPTIONS: "--max-old-space-size=1024"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: virachave-web
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 192m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=8m
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:2025.2.1
    container_name: virachave-tunnel
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 192m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  uploads_data:
