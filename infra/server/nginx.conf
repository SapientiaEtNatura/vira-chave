upstream nextjs_app {
    server app:3000;
    keepalive 32;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "https" "https";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

map $http_host $forwarded_host {
    default $http_host;
    ''      $host;
}

map $request_method $api_write_limit_key {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    PATCH   $binary_remote_addr;
    DELETE  $binary_remote_addr;
}

# Extrai IP real apenas de proxies confiáveis na rede privada/Docker (cloudflared)
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Zonas calibradas para laboratório escolar atrás de NAT (30-40 alunos/IP)
limit_req_zone $binary_remote_addr zone=auth_reset_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_session_limit:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=admin_check_links_limit:10m rate=5r/m;
limit_req_zone $api_write_limit_key zone=api_write_limit:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=public_share_limit:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 6M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $forwarded_host;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    error_page 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://nextjs_app;
    }

    location /_next/static/ {
        access_log off;
        proxy_pass http://nextjs_app;
    }

    location = /api/auth/reset-password {
        limit_req zone=auth_reset_limit burst=5 nodelay;
        proxy_pass http://nextjs_app;
    }

    location ~ ^/api/auth/(session|csrf)$ {
        limit_req zone=auth_session_limit burst=40 nodelay;
        proxy_pass http://nextjs_app;
    }

    location ~ ^/api/(auth/(register|callback|signin|signout)|account/) {
        limit_req zone=auth_limit burst=40 nodelay;
        proxy_pass http://nextjs_app;
    }

    location = /api/admin/content/check-links {
        limit_req zone=admin_check_links_limit burst=2 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://nextjs_app;
    }

    location ~ ^/api/(challenges|portfolio|tracks|discovery|educator|admin)/ {
        limit_req zone=api_write_limit burst=60 nodelay;
        proxy_pass http://nextjs_app;
    }

    location ~ ^/(p/|api/files/) {
        limit_req zone=public_share_limit burst=40 nodelay;
        proxy_pass http://nextjs_app;
    }

    location / {
        proxy_pass http://nextjs_app;
    }
}
